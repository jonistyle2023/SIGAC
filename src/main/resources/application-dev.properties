# Dev profile — activated with -Dspring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev)
# NEVER use these values in production.

# JWT secret for local dev (exactly 64 bytes)
jwt.secret=dev-only-insecure-secret-for-local-development-only-do-not-use-in-prod-aabbccdd

cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

bootstrap.secret=dev-bootstrap-secret

# MySQL local — misma base que producción pero en localhost
spring.datasource.url=jdbc:mysql://localhost:3306/sigac?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Flyway aplica sobre MySQL local igual que en producción
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Verbose logging is fine in dev
logging.level.com.example.sigac=DEBUG
logging.level.org.springframework.security=DEBUG
